<style>
/* Layout: fixed sidebar of sections + scrolling work area; every color comes from the active theme tokens set by script */
:root {
  --bg:#FBF7F2; --surface:#FFFFFF; --line:#EFE3DC; --soft:#F3E1DE; --main:#C98B8B; --onMain:#FFFFFF; --accent:#C9A96E;
  --text:#4A3B3B; --strong:#3B2E2E; --muted:#8E7B78; --alert:#A2453F; --alertBg:#F6DEDA;
  --head:"Cormorant Garamond", Georgia, serif; --body:"Lato", system-ui, sans-serif; --script:"Great Vibes", "Snell Roundhand", cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#221A1B; --surface:#2C2223; --line:#3D3132; --soft:#3A2B2C; --main:#D9A0A0; --onMain:#2A1C1D; --accent:#D4B57E; --text:#EADCD8; --strong:#F7ECE8; --muted:#A8928F; --alert:#F2A49C; --alertBg:#4A2624; color-scheme: dark } }
:root[data-theme="dark"] { --bg:#221A1B; --surface:#2C2223; --line:#3D3132; --soft:#3A2B2C; --main:#D9A0A0; --onMain:#2A1C1D; --accent:#D4B57E; --text:#EADCD8; --strong:#F7ECE8; --muted:#A8928F; --alert:#F2A49C; --alertBg:#4A2624; color-scheme: dark }
:root[data-mode="dark"] { color-scheme: dark }
:root[data-mode="light"] { color-scheme: light }
:root { --mainDeep: var(--main); }
:root[data-mode="light"]:not([data-contrast="true"]) { --mainDeep: color-mix(in srgb, var(--main) 80%, black); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--mainDeep); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: grid; grid-template-columns: var(--sidew, 252px) minmax(0,1fr); min-height: 100%; }
.side-resize { position: fixed; top: 0; left: calc(var(--sidew, 252px) - 4px); width: 8px; height: 100vh; cursor: col-resize; z-index: 6; touch-action: none; }
.side-resize::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
.side-resize:hover::after, .side-resize:focus-visible::after, body.resizing .side-resize::after { background: var(--main); }
.side-resize:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
.cards.swatches { grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
.swatchbig { border-bottom: 1px solid var(--line); }
.swatchbig input[type=color] { display: block; width: 100%; height: 130px; border: 0; border-radius: 0; padding: 0; background: none; cursor: pointer; }
.swatchbig input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.swatchbig input[type=color]::-webkit-color-swatch { border: 0; border-radius: 0; }
.swatchbig input[type=color]::-moz-color-swatch { border: 0; border-radius: 0; }
.kids { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.kids .chip { font-size: 12px; }
.kids select { width: auto !important; min-width: 120px; font-size: 12px; padding-block: 4px !important; }
.tbl.freeze th:first-child, .tbl.freeze td:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); box-shadow: 2px 0 0 var(--gridline), 6px 0 10px -6px rgba(0,0,0,.18); }
.tbl.freeze th:first-child { z-index: 3; background: color-mix(in srgb, var(--soft) 70%, var(--surface)); }
.tbl.freeze tbody tr:hover td:first-child { background: color-mix(in srgb, var(--soft) 25%, var(--surface)); }
.chart { gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.hbar { display: grid; grid-template-columns: minmax(90px, 180px) minmax(0, 1fr) 70px; align-items: center; gap: 12px; font-size: 13px; }
.hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--strong); }
.htrack { background: color-mix(in srgb, var(--soft) 50%, var(--surface)); border-radius: 6px; height: 22px; overflow: hidden; }
.hfill { display: flex; height: 100%; border-radius: 6px; overflow: hidden; min-width: 4px; }
.hfill i { display: block; height: 100%; }
.hv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.hv b { color: var(--strong); }
.s-att { background: var(--main); }
.s-pen { background: var(--accent); }
.s-not { background: color-mix(in srgb, var(--muted) 45%, var(--surface)); }
.s-dec { background: var(--alert); opacity: .75; }
.tag.c-signed { background: #3F7A53; color: #fff; }
.tag.c-sent { background: var(--accent); color: var(--strong); }
.tag.c-todo { background: transparent; color: var(--muted); border: 1px solid var(--fieldline); }
:root[data-mode="dark"] .tag.c-signed { background: #3F7A53; color: #fff; }
:root[data-mode="dark"] .tag.c-sent { background: var(--accent); color: var(--bg); }
:root[data-mode="dark"] .tag.c-todo { background: transparent; color: var(--text); }
:root[data-mode="dark"] .exbadge { color: var(--bg); }
.quickadd { gap: 10px; }
.qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px 14px; align-items: end; }
.qa-grid .qa-task { grid-column: span 2; }
.qa-grid input[type=date] { min-width: 0; }
.qa-grid label { display: grid; gap: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--strong); min-width: 0; }
.qa-grid input, .qa-grid select { width: 100%; min-width: 0; box-sizing: border-box; border: 1px solid var(--fieldline); background-color: var(--field); color: var(--text); border-radius: 9px; padding: 8px 10px; font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.qa-grid select:disabled { opacity: .6; }
.qa-hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.qa-grid .btn { height: 38px; white-space: nowrap; }
@media (max-width: 520px) { .qa-grid .qa-task { grid-column: 1 / -1; } }
.pbar { display: grid; grid-template-columns: minmax(0,1fr) 38px; align-items: center; gap: 8px; padding-inline: 6px; font-size: 12px; color: var(--muted); }
.pbar span { text-align: right; }
.pbar.over .bar i { background: var(--alert); }
.pbar.over span { color: var(--alert); font-weight: 700; }
aside.side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px 28px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.brand { padding: 4px 10px 16px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.brand .names { font-family: var(--script); font-size: 30px; line-height: 1.15; color: var(--strong); }
.brand small { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.navgroup { margin: 14px 0 4px; padding: 0 10px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.nav a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 13.5px; }
.nav a:hover { background: var(--soft); }
.nav a.on { background: var(--soft); color: var(--strong); font-weight: 700; }
.nav a .em { width: 20px; text-align: center; }
.nav a .badge { margin-left: auto; background: var(--alert); color: var(--surface); font-size: 10.5px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }

.mainwrap { min-width: 0; display: flex; flex-direction: column; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top .spacer { flex: 1; }
.savestate { font-size: 12px; color: var(--muted); }
.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.ctl select, .btn, .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 11px; font-size: 13px; cursor: pointer; color: var(--text); }
.btn.primary { background: var(--mainDeep); color: var(--onMain); border-color: var(--mainDeep); font-weight: 600; }
.btn:hover, .icon-btn:hover { border-color: var(--muted); }
.icon-btn { padding: 4px 9px; line-height: 1.2; }
#menuBtn { display: none; }
main#view { padding-block: 24px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); width: 100%; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { font-family: var(--head); font-weight: 600; font-size: clamp(28px, 3.4vw, 38px); margin: 2px 0 0; color: var(--strong); line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--head); font-weight: 600; font-size: 22px; margin: 0; color: var(--strong); }
h3 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 0; color: var(--muted); font-weight: 700; }
details.help { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; margin-bottom: 20px; max-width: 900px; }
details.help summary { cursor: pointer; font-weight: 600; color: var(--strong); font-size: 13px; }
details.help p, details.help li { color: var(--text); margin: 8px 0 0; max-width: 75ch; }
details.help ul { padding-left: 18px; margin: 4px 0 0; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--accent); width: 60%; margin: 6px auto; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--accent); opacity: .6; }
.divider i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--accent); }

.block { margin-bottom: 30px; display: grid; gap: 10px; }
/* Sections: a clear title with an accent bar, and a divider between sections */
#view > .block + .block, #view > .block + .seat-layout, #view > .stats + .block { border-top: 1px solid var(--gridline); padding-top: 26px; margin-top: 8px; }
.block-head h2, .block > h2, .vendorbox > h2, .panel.hi > h2 { display: flex; align-items: center; gap: 10px; }
.block-head h2::before, .block > h2::before, .panel.hi > h2::before { content: ""; width: 5px; height: 1.05em; border-radius: 3px; background: var(--main); flex: none; }
/* Groups inside a section: a tinted strip so each group starts clearly */
/* Table titles: a colored bar joined to the top of its table */
.group { gap: 0; }
.group-head, .block-head:has(+ .tbl-wrap) { background: var(--mainDeep); color: var(--onMain); border: 1px solid var(--mainDeep); border-radius: var(--r) var(--r) 0 0; padding: 8px 8px 8px 16px; min-height: 46px; align-items: center; }
.group-head h3 { color: var(--onMain); font-size: 13px; letter-spacing: .1em; }
.block-head:has(+ .tbl-wrap) { margin-bottom: -10px; }
.block-head:has(+ .tbl-wrap) h2 { color: var(--onMain); font-size: 19px; }
.block-head:has(+ .tbl-wrap) h2::before { background: var(--onMain); opacity: .7; }
.group-head + .tbl-wrap, .block-head + .tbl-wrap { border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.group-head .count { background: color-mix(in srgb, var(--onMain) 25%, transparent); color: var(--onMain); }
.group-head .btn.primary, .block-head:has(+ .tbl-wrap) .btn.primary { background: var(--onMain); color: var(--mainDeep); border-color: var(--onMain); }
.block-head:has(+ .tbl-wrap) .btn:not(.primary) { background: transparent; color: var(--onMain); border-color: color-mix(in srgb, var(--onMain) 60%, transparent); }
.contrib-sum { display: block; margin-top: 4px; font-size: 13.5px; }
.block-head .headnote { flex: 0 0 100%; width: 100%; max-width: none; margin: 0; order: 5; }
.block-head:has(+ .tbl-wrap) .headnote { color: var(--onMain); opacity: .9; padding-bottom: 2px; }
.group-head:not(:has(+ .tbl-wrap)) { border-radius: var(--r); margin-bottom: 10px; }
.group { margin-top: 14px; }
.group + .group { margin-top: 20px; }
/* Vendor and detail blocks at the top of a page: colored to stand apart */
.vendorbox .form, .panel.hi { background: color-mix(in srgb, var(--soft) 65%, var(--surface)); border-color: color-mix(in srgb, var(--main) 35%, var(--line)); }
.vendorbox .form label, .panel.hi .note { color: var(--strong); }
.twoblocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }
.vendorbox { display: grid; gap: 10px; align-content: start; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.note { color: var(--muted); margin: 0; font-size: 13px; max-width: 80ch; }
.group { display: grid; }
.group-head { display: flex; align-items: center; gap: 8px; }
.count { font-size: 11px; background: var(--soft); color: var(--strong); border-radius: 99px; padding: 1px 8px; font-weight: 700; }

:root { --gridline: color-mix(in srgb, var(--line) 70%, var(--muted)); --fieldline: color-mix(in srgb, var(--line) 45%, var(--muted)); --field: var(--surface); }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--gridline); border-radius: var(--r); }
table.tbl { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--strong); font-weight: 700; padding: 10px 10px; border-bottom: 2px solid var(--gridline); border-right: 1px solid var(--gridline); white-space: nowrap; background: color-mix(in srgb, var(--soft) 70%, var(--surface)); }
.tbl td { padding: 5px 6px; border-bottom: 1px solid var(--gridline); border-right: 1px solid var(--gridline); vertical-align: middle; }
.tbl th:last-child, .tbl td:last-child { border-right: 0; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--soft) 25%, transparent); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.done td input[type=text], .tbl tr.done td textarea { text-decoration: line-through; color: var(--muted); }
.tbl input:not([type=checkbox]):not([type=color]), .tbl select, .tbl textarea { width: 100%; min-width: 0; border: 1px solid var(--fieldline); background: var(--field); border-radius: 7px; padding: 6px 8px; }
.tbl input:not([type=checkbox]):hover, .tbl select:hover, .tbl textarea:hover { border-color: var(--main); }
.tbl input:focus, .tbl select:focus, .tbl textarea:focus { border-color: var(--main); background: var(--field); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--main) 25%, transparent); }
.tbl textarea { resize: none; overflow: hidden; min-height: 32px; display: block; }
.tbl .c-check, .tbl .c-act { width: 36px; text-align: center; }
.tbl .c-money input, .tbl .c-num input { text-align: right; }
.tbl .c-calc { white-space: nowrap; padding-inline: 10px; color: var(--strong); }
.tbl tr.empty td { color: var(--muted); padding: 14px; text-align: center; }
select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%) !important; background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52% !important; background-size: 5px 5px, 5px 5px !important; background-repeat: no-repeat !important; padding-right: 30px !important; text-overflow: ellipsis; }
select::-ms-expand { display: none; }
.tbl select { background-color: var(--field); }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--main); cursor: pointer; }
input[type=color] { width: 40px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
.del { color: var(--muted); border-color: transparent; background: transparent; font-size: 16px; }
.del:hover { color: var(--alert); }
button.add { justify-self: start; border: 1px dashed var(--line); background: transparent; border-radius: 9px; padding: 7px 12px; color: var(--main); font-weight: 600; cursor: pointer; }
button.add:hover { border-color: var(--main); }
.urlcell { display: flex; align-items: center; gap: 2px; }
.urlcell a { text-decoration: none; padding: 0 4px; }
.multi { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; }
.chipbtn { font-size: 11px; border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 2px 8px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.chipbtn.on { background: var(--mainDeep); border-color: var(--mainDeep); color: var(--onMain); }
.tag { display: inline-block; font-size: 11px; border-radius: 99px; padding: 1px 8px; background: var(--soft); color: var(--strong); font-weight: 600; }
.tag.late { background: var(--alertBg); color: var(--alert); }
.tag.ok { background: var(--mainDeep); color: var(--onMain); }
:root[data-mode="dark"] .tag:not(.late):not(.ok) { background: color-mix(in srgb, var(--main) 42%, var(--surface)); color: var(--strong); }
:root[data-mode="dark"] .tag.late { background: var(--alert); color: var(--bg); }

/* cards without a photo: keep the first field clear of the × in the corner */
.citem > .del + .cbody > .f:first-child { padding-right: 30px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.citem { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; align-content: start; position: relative; }
.citem.chosen { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.citem .cbody { padding: 10px 12px 12px; display: grid; gap: 6px; }
.citem label.f { display: grid; gap: 2px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.citem label.f.inline { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--strong); }
.citem input:not([type=checkbox]):not([type=color]), .citem select, .citem textarea { width: 100%; border: 1px solid var(--fieldline); background: var(--field); border-radius: 8px; padding: 6px 8px; font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text); }
.citem textarea { resize: vertical; min-height: 34px; }
.citem .del { position: absolute; top: 6px; right: 6px; background: var(--surface); border-radius: 99px; z-index: 1; }
.citem .calcline { font-size: 13px; color: var(--strong); text-transform: none; letter-spacing: 0; }
.imgbox { aspect-ratio: 4 / 3; max-width: 100%; background: var(--soft); display: grid; place-items: center; cursor: pointer; border: 0; width: 100%; padding: 0; color: var(--muted); font-size: 13px; position: relative; overflow: hidden; }
.imgbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tbl .imgbox { width: 64px; aspect-ratio: 1; border-radius: 8px; }
.imgbox .rm { position: absolute; bottom: 6px; right: 6px; font-size: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }

.form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px 16px; }
.form label { display: grid; gap: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; min-width: 0; }
.form label.wide { grid-column: 1 / -1; }
.form input:not([type=checkbox]):not([type=color]), .form select, .form textarea { width: 100%; border: 1px solid var(--fieldline); background: var(--field); border-radius: 9px; padding: 8px 10px; font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text); }
.form textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; }
.stat .k { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--head); font-size: 26px; font-weight: 600; color: var(--strong); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .s { font-size: 12px; color: var(--muted); }
.bar { height: 7px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--main); border-radius: inherit; }
.bar.over i { background: var(--alert); }

.hero { position: relative; text-align: center; background: radial-gradient(120% 150% at 50% 0%, color-mix(in srgb, var(--main) 30%, var(--soft)) 0%, color-mix(in srgb, var(--main) 62%, var(--soft)) 70%, color-mix(in srgb, var(--accent) 45%, var(--main)) 100%); border: 1px solid color-mix(in srgb, var(--main) 45%, var(--line)); border-radius: 18px; padding: 26px 18px 22px; margin-bottom: 18px; display: grid; gap: 4px; overflow: hidden; }
.hero .sprig { position: absolute; top: 12px; width: 84px; height: 84px; color: var(--accent); opacity: .5; }
.hero .sprig.r { right: 14px; } .hero .sprig.l { left: 14px; transform: scaleX(-1); }
.hero .when { margin-bottom: 14px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--strong); opacity: .8; }
.hero .countdown small, .hero .note { color: var(--strong); opacity: .8; }
.hero .sprig { opacity: .85; color: var(--strong); }
.dash-stats .stat, .hero + .stats .stat { border-top: 4px solid var(--main); }
.hero + .stats .stat:nth-child(even) { border-top-color: var(--accent); }
.hero .names { font-family: var(--script); font-size: clamp(40px, 6vw, 60px); line-height: 1.25; color: var(--strong); }
.countdown { display: flex; justify-content: center; gap: 26px; margin-top: 6px; flex-wrap: wrap; }
.countdown div { display: grid; }
.countdown strong { font-family: var(--head); font-size: 34px; font-weight: 600; color: var(--strong); line-height: 1.1; font-variant-numeric: tabular-nums; }
.countdown small { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.nlist { display: grid; gap: 2px; }
.nitem { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); }
.nitem:last-child { border-bottom: 0; }
.nitem .src { font-size: 11px; color: var(--muted); white-space: nowrap; }
.nitem > .tag { display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.25; padding: 3px 8px; min-height: 22px; border-radius: 11px; }
.hero .divider { color: var(--strong); width: 56%; }
.hero .divider::before, .hero .divider::after { height: 1.5px; background: var(--strong); opacity: .45; }
.hero .divider i { background: var(--accent); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--strong) 35%, transparent); }
.empty-state { color: var(--muted); font-size: 13px; padding: 6px 0; }
.story { font-family: var(--head); font-size: 18px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; }
.palette i { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); color: var(--strong); border-radius: 99px; padding: 3px 4px 3px 10px; font-size: 12.5px; }
.chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 5px; }
.chipadd { display: flex; gap: 6px; }
.chipadd input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 6px 9px; }
.setup-lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }

.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-head h2 { min-width: 190px; }
.cal-filters { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.cal-filters label { display: inline-flex; gap: 6px; align-items: center; }
.cal-filters select { border: 1px solid var(--fieldline); background-color: var(--field); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
:where(select) { padding-left: 10px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--line); gap: 1px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cal .dow { background: var(--surface); text-align: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 7px 0; font-weight: 700; }
.cal .day { background: var(--surface); min-height: 96px; padding: 5px; display: grid; align-content: start; gap: 3px; min-width: 0; }
.cal .day.out { background: var(--bg); }
.cal .day.out .dn { opacity: .45; }
.cal .day.today .dn { background: var(--mainDeep); color: var(--onMain); }
.cal .day.wed { background: var(--soft); }
.cal .dn { font-size: 12px; font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; color: var(--strong); }
.ev { font-size: 11px; border-radius: 5px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--soft); color: var(--strong); border-left: 3px solid var(--main); text-decoration: none; display: block; }
.ev.k-appt { border-left-color: var(--accent); }
.ev.k-pay { border-left-color: var(--alert); }
.ev.k-extra, .ev.k-other { border-left-color: var(--muted); }
.ev.done { text-decoration: line-through; opacity: .6; }
.more { font-size: 11px; color: var(--muted); }

.seat-table, .seat-table > *, .seat-list, .slot { min-width: 0; }
.slot select { max-width: 100%; }
.seat-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.seat-side { position: sticky; top: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; gap: 10px; max-height: calc(100vh - 96px); overflow-y: auto; }
.seat-side .block-head h2 { font-size: 19px; display: flex; gap: 8px; align-items: center; }
.seat-side > select { justify-self: stretch; }
.seat-head { display: flex; align-items: center; gap: 6px; }
.seat-head .tname { flex: 1; min-width: 0; font-family: var(--head); font-size: 19px; font-weight: 600; color: var(--strong); border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 2px 6px; }
.seat-head .tname:hover, .seat-head .tname:focus { border-color: var(--line); background: var(--bg); outline: none; }
.seat-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.seat-meta label { display: inline-flex; align-items: center; gap: 6px; }
.seat-meta .tseats { width: 60px; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 3px 6px; text-align: right; }
.slot { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 6px; }
.slot .sn { font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.slot select { width: 100%; min-width: 0; border: 1px dashed var(--line); background-color: transparent; border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--muted); }
.slot.taken select { border-style: solid; background-color: var(--bg); color: var(--strong); font-weight: 600; }
.slot.over { grid-template-columns: 22px minmax(0, 1fr) auto; font-size: 12px; color: var(--alert); }
.urow { display: grid; gap: 1px; padding: 7px 9px; background: var(--bg); border-radius: 8px; font-size: 13px; }
.urow small { color: var(--muted); font-size: 11.5px; }
.seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.seat-table { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.seat-table.full { border-color: var(--main); }
.seat-table.over { border-color: var(--alert); }
.seat-table h4 { margin: 0; font-family: var(--head); font-size: 19px; color: var(--strong); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.seat-table h4 small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 400; }
.seat-list { display: grid; gap: 4px; }
.seat { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 13px; padding: 4px 8px; background: var(--bg); border-radius: 7px; }
.seat.emptyseat { color: var(--muted); border: 1px dashed var(--line); background: transparent; }
.unseated { display: grid; gap: 6px; }
.unseated .row { display: grid; grid-template-columns: minmax(0,1fr) 160px; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; }
.unseated .row small { color: var(--muted); display: block; }
.unseated select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px; width: 100%; }

.vows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.vowcol { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.vowcol h2 { font-family: var(--script); font-weight: 400; font-size: 36px; }

const FR_ROLE = { bride: "mariée", groom: "marié" };
/* "de la mariée", "du marié", "d'Emma", "de James" */
function frOf(x) {
  const m = x.match(/^(Bride|Groom)( \d)?$/);
  if (m) return (m[1] === "Bride" ? "de la mariée" : "du marié") + (m[2] || "");
  return /^[aeiouyhàâéèêëîïôûAEIOUYHÉÈ]/.test(x) ? "d'" + x : "de " + x;
}

  return `<div class="tbl-wrap"><table class="tbl${LISTS[key] && LISTS[key].freeze ? " freeze" : ""}"><thead><tr>${head}<th class="c-act"></th></tr></thead><tbody>${body}${empty}</tbody></table></div>`;
}
function cardsHTML(key, fs, rs, o) {
  if (!rs.length) return `<p class="empty-state">${o.empty || "Nothing here yet."}</p>`;
  return `<div class="cards ${LISTS[key].cls || ""}">${rs.map(r => {
    r.__list = key;
    const parts = fs.map(f => {
      const b = `list|${key}|${r.id}|${f.k}`;
      if (f.type === "image") return input(f, b, r[f.k], r);
      if (f.type === "color") return `<div class="swatchbig">${input(f, b, r[f.k], r)}</div>`;
      if (f.type === "check") return `<label class="f inline">${input(f, b, r[f.k], r)} ${esc(f.label)}</label>`;
      if (f.type === "calc") return `<label class="f">${esc(f.label)}<span class="calcline">${input(f, b, r[f.k], r)}</span></label>`;
      return `<label class="f">${esc(f.label)}${input(f, b, r[f.k], r)}</label>`;
    });
    const img = fs[0] && (fs[0].type === "image" || fs[0].type === "color") ? parts.shift() : "";
    return `<article class="citem ${r.chosen ? "chosen" : ""}" data-row="${r.id}"><button type="button" class="icon-btn del" data-del="${key}|${r.id}" aria-label="Delete" title="Delete">×</button>${img}<div class="cbody">${parts.join("")}</div></article>`;
  }).join("")}</div>`;
}
function form(fields, scope = "single") {
  return `<div class="form">${fields.map(f => `<label class="${f.wide ? "wide" : ""}">${esc(f.label)}${input(f, `${scope}|${f.k}`, S[scope][f.k])}</label>`).join("")}</div>`;
}

/* ================= Dates & notifications ================= */
function calItems() {
  const L = S.lists, out = [];
  const name = id => (getRow("vendors", id) || {}).name || "";
  L.tasks.forEach(r => { const d = effDue(r); if (d && (r.due || daysUntil(d) >= 0)) out.push({ date: d, title: r.task || "Task", kind: "task", done: !!r.done, sec: "tasks", src: "Task" }); });
  L.appointments.forEach(r => r.date && out.push({ date: r.date, time: r.time, title: (r.title || "Appointment") + (r.with ? " · " + name(r.with) : ""), kind: "appt", done: !!r.done, sec: "appointments", src: "Appointment" }));
  L.payments.forEach(r => r.due && out.push({ date: r.due, title: `${name(r.vendor) || "Vendor"} ${(r.kind || "payment").toLowerCase()}, ${money(r.amount)}`, kind: "pay", done: !!r.paid, sec: "budget", src: "Payment" }));
  L.extras.forEach(r => r.date && out.push({ date: r.date, title: r.title || "Deadline", kind: "extra", done: !!r.done, sec: "calendar", src: "Deadline" }));
  L.purchases.forEach(r => { const fin = r.status === "Received" || r.status === "Returned";
    if (r.needBy) out.push({ date: r.needBy, title: `Get: ${r.item || "item"}`, kind: "other", done: fin, sec: "purchases", src: "Purchase" });
    if (r.kind === "Rent" && r.returnBy) out.push({ date: r.returnBy, title: `Return: ${r.item || "rental"}`, kind: "other", done: r.status === "Returned", sec: "purchases", src: "Rental" }); });
  L.hotels.forEach(r => r.cutoff && out.push({ date: r.cutoff, title: `Room block cutoff: ${r.hotel || "hotel"}`, kind: "other", done: daysUntil(r.cutoff) < 0, sec: "logistics", src: "Hotel" }));
  L.events.forEach(r => r.date && out.push({ date: r.date, time: r.time, title: r.event || "Event", kind: "other", done: daysUntil(r.date) < 0, sec: "celebrations", src: "Event" }));
  L.party.forEach(r => r.fitting && out.push({ date: r.fitting, title: `Fitting: ${r.name || "wedding party"}`, kind: "appt", done: r.status === "Ready", sec: "party", src: "Wedding party" }));
  L.hmBookings.forEach(r => r.date && out.push({ date: r.date, time: r.time, title: r.name || r.type || "Booking", kind: "other", done: daysUntil(r.date) < 0, sec: "honeymoon", src: "Honeymoon" }));
  return out;
}
function notifications() {
  const items = calItems().filter(i => !i.done).map(i => ({ ...i, n: daysUntil(i.date) })).filter(i => i.n !== null && i.n <= 14);
  items.sort((a, b) => a.n - b.n || (a.time || "").localeCompare(b.time || ""));
  const extra = [];
  const g = S.lists.guests; const pending = g.filter(x => x.rsvp === "Pending").length;
  const w = daysUntil(S.setup.date);
  if (pending && w !== null && w <= 60 && w >= 0) extra.push({ title: `${pending} guests have not answered their RSVP`, sec: "guests", src: "Guests", label: "RSVPs" });
  if (w !== null && w < 0) { const owed = g.filter(x => x.gift && !x.tySent).length + S.lists.thanks.filter(x => !x.sent).length; if (owed) extra.push({ title: `${owed} thank-you cards still to send`, sec: "thanks", src: "Thank you cards", label: "After" }); }
  return { items, extra, urgent: items.filter(i => i.n <= 7).length + extra.length };
}

sec("dashboard", "📊", "Dashboard", G1, `<p>Your countdown and a summary of the budget, tasks, guests and vendors. The Notification Center lists anything overdue or due in the next 14 days, pulled from Tasks, Appointments, Budget payments, Purchases and more.</p>

sec("calendar", "🗓️", "Calendar", G2, `<p>The calendar pulls dates from Tasks, Appointments, Budget payments, Purchases, Logistics, Celebrations and Honeymoon. Choose what to show with the checkboxes. Add other deadlines in the table below the calendar.</p>`, s => {
  const sg = S.single;
  if (!sg.calMonth) { const d = parseD(S.setup.date); const t = today(); sg.calMonth = iso(t).slice(0, 7); }
  const [y, m] = sg.calMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const startDow = S.setup.weekStart === "mon" ? 1 : 0;
  const offset = (first.getDay() - startDow + 7) % 7;
  const start = new Date(y, m - 1, 1 - offset);
  const show = { task: sg.calShow_tasks, appt: sg.calShow_appts, pay: sg.calShow_pays, extra: sg.calShow_extras, other: sg.calShow_other };
  const items = calItems().filter(i => show[i.kind] && (sg.calStatus === "all" || (sg.calStatus === "done") === i.done));
  const byDay = {}; items.forEach(i => (byDay[i.date] = byDay[i.date] || []).push(i));
  const dows = Array.from({ length: 7 }, (_, i) => new Date(2023, 0, 1 + ((i + startDow) % 7)).toLocaleDateString(LOC(), { weekday: "short" }));
  const todayS = iso(today());
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d); const evs = byDay[k] || [];
    if (i >= 35 && d.getMonth() !== m - 1) break;
    cells += `<div class="day ${d.getMonth() !== m - 1 ? "out" : ""} ${k === todayS ? "today" : ""} ${k === S.setup.date ? "wed" : ""}"><span class="dn">${d.getDate()}</span>${k === S.setup.date ? `<span class="ev k-appt">💍 Wedding day</span>` : ""}${evs.slice(0, 3).map(e => `<a href="#${e.sec}" class="ev k-${e.kind} ${e.done ? "done" : ""}" title="${esc(e.title)}">${e.done ? "✓ " : ""}${esc(e.title)}</a>`).join("")}${evs.length > 3 ? `<span class="more">+${evs.length - 3} more</span>` : ""}</div>`;
  }
  const monthItems = items.filter(i => i.date.startsWith(sg.calMonth)).sort((a, b) => a.date.localeCompare(b.date));
  const chk = (k, label) => `<label><input type="checkbox" data-b="single|${k}" data-t="check" ${sg[k] ? "checked" : ""}> ${label}</label>`;
  return head(s) + `<section class="block">
    <div class="cal-head"><button class="btn" type="button" data-cal="-1" aria-label="Previous month">‹</button><h2>${first.toLocaleDateString(LOC(), { month: "long", year: "numeric" })}</h2><button class="btn" type="button" data-cal="1" aria-label="Next month">›</button><button class="btn" type="button" data-cal="0">Today</button>${S.setup.date ? `<button class="btn" type="button" data-cal="w">Wedding month</button>` : ""}</div>
    <div class="cal-filters">${chk("calShow_tasks", "Tasks")}${chk("calShow_appts", "Appointments")}${chk("calShow_pays", "Vendor payments")}${chk("calShow_extras", "Extra deadlines")}${chk("calShow_other", "Other dates")}
      <label>Show <select data-b="single|calStatus" data-t="select" aria-label="Status filter"><option value="all" ${sg.calStatus === "all" ? "selected" : ""}>Done and not done</option><option value="open" ${sg.calStatus === "open" ? "selected" : ""}>Not done only</option><option value="done" ${sg.calStatus === "done" ? "selected" : ""}>Done only</option></select></label></div>
    <div class="tbl-wrap" style="border:0;background:none"><div class="cal" style="min-width:640px">${dows.map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div></div>
  </section>
  <section class="block"><h2>This month</h2>${monthItems.length ? `<div class="panel"><div class="nlist">${monthItems.map(i => `<a class="nitem" href="#${i.sec}"><span class="tag ${!i.done && daysUntil(i.date) < 0 ? "late" : i.done ? "ok" : ""}">${fmtDate(i.date)}</span><span>${i.done ? "✓ " : ""}${esc(i.title)}${i.time ? ` · ${fmtTime(i.time)}` : ""}</span><span class="src">${esc(i.src)}</span></a>`).join("")}</div></div>` : `<p class="empty-state">Nothing scheduled this month with the current filters.</p>`}</section>
  ${listBlock("extras", { title: "Extra deadlines", note: "Deadlines that don't belong to another section, like RSVP-by dates or a dress order cutoff." })}`;
});

sec("budget", "💰", "Wedding Budget", G2, `<p>Set a budget per category, record what each supporter contributes, log expenses, and track vendor payments with due dates. Spending per category adds up expenses plus vendor payments marked paid. Unpaid payments appear in the Calendar and the Notification Center.</p>`, s => {
  const L = S.lists;
  const stat = (k, fn, sub) => `<div class="stat"><span class="k">${k}</span><span class="v">${calc(fn)}</span><span class="s">${sub ? calc(sub) : ""}</span></div>`;
  const total = () => num(S.setup.totalBudget) || sum(S.lists.budgetCats, c => c.budget);
  const spent = () => sum(S.lists.expenses, e => e.amount) + sum(S.lists.payments.filter(p => p.paid), p => p.amount);
  return head(s) + `<div class="stats">
    ${stat("Total budget", () => money(total()), () => num(S.setup.totalBudget) ? "set in Settings" : "sum of categories")}
    ${stat("Spent", () => money(spent()), () => `<div class="bar ${spent() > total() && total() ? "over" : ""}"><i style="width:${pct(spent(), total())}%"></i></div>`)}
    ${stat("Remaining", () => money(total() - spent()))}
    ${stat("Upcoming payments", () => money(sum(S.lists.payments.filter(p => !p.paid), p => p.amount)), () => `${S.lists.payments.filter(p => !p.paid).length} unpaid`)}
    ${stat("Contributions received", () => money(sum(S.lists.contributions, c => c.received)), () => `of ${money(sum(S.lists.contributions, c => c.promised))} promised`)}
  </div>` +
  listBlock("budgetCats", { title: "Budget by category" }) +
  listBlock("payments", { title: "Vendor payments", note: "Vendors come from the Vendors section. Check Paid when a payment is made." }) +
  listBlock("expenses", { title: "Expenses" }) +
  listBlock("contributions", { title: "Contributions", note: `Who is paying for the wedding. Supporters come from Settings. ${calc(() => {
    const b = total(), pr = sum(S.lists.contributions, r => r.promised), rc = sum(S.lists.contributions, r => r.received), gap = b - pr;
    return `<span class="contrib-sum"><b>Promised ${money(pr)} of your ${money(b)} budget</b> · received ${money(rc)} · ${!b ? "set a total budget in Settings" : gap > 0 ? `<b>${money(gap)} still not covered</b>` : gap < 0 ? `<b>${money(-gap)} more than the budget</b>` : "<b>fully covered ✓</b>"}</span>`; })}` }) +
  `<p class="note">Purchases and rentals are tracked separately in <a href="#purchases">Purchase/Rental List</a>. Log them here as expenses when you pay.</p>`;
});

sec("purchases", "🛍️", "Purchase/Rental List", G2, `<p>Track everything you need to buy or rent, with the date you need it and, for rentals, the return date. Both dates appear in the Calendar.</p>`, s => head(s) +
  `<div class="stats"><div class="stat"><span class="k">Total</span><span class="v">${calc(() => money(sum(S.lists.purchases, r => num(r.unit) * (r.qty === "" || r.qty == null ? 1 : num(r.qty)))))}</span><span class="s">all items</span></div>
   <div class="stat"><span class="k">Still to get</span><span class="v">${S.lists.purchases.filter(r => !r.status || r.status === "To get" || r.status === "Ordered").length}</span><span class="s">items not received</span></div>
   <div class="stat"><span class="k">Rentals to return</span><span class="v">${S.lists.purchases.filter(r => r.kind === "Rent" && r.status !== "Returned").length}</span><span class="s">not returned yet</span></div></div>` +

sec("guests", "👥", "Guest List", G3, `<p>Add every invitee with their tag, RSVP, dietary needs and accommodation. Use <b>Plus one / with</b> to link guests who come together, <b>Child</b> to mark children, and <b>Their children</b> to say whose children they are. The Seating Chart uses these links to keep families together. Tables come from the Seating Chart. Gifts and thank-you cards are tracked in Thank You Cards.</p>`, s => {
  const g = S.lists.guests; const c = r => g.filter(x => x.rsvp === r).length;
  const tagCounts = S.setup.guestTags.map(t => [t, g.filter(x => x.tag === t && x.rsvp === "Attending").length, g.filter(x => x.tag === t).length]);
  return head(s) + `<div class="stats">
    <div class="stat"><span class="k">Invited</span><span class="v">${g.length}</span><span class="s">${g.filter(x => x.child).length} children</span></div>
    <div class="stat"><span class="k">Attending</span><span class="v">${c("Attending")}</span><div class="bar"><i style="width:${pct(c("Attending"), g.length)}%"></i></div></div>
    <div class="stat"><span class="k">Waiting</span><span class="v">${c("Pending") + c("Not sent") + g.filter(x => !x.rsvp).length}</span><span class="s">${c("Not sent") + g.filter(x => !x.rsvp).length} invitations not sent</span></div>
    <div class="stat"><span class="k">Declined</span><span class="v">${c("Declined")}</span></div>
    <div class="stat"><span class="k">Need a room</span><span class="v">${g.filter(x => x.accNeeded && x.rsvp !== "Declined").length}</span><span class="s">see Logistics</span></div>
  </div>` + listBlock("guests", { title: "Guests" }) +

    const untagged = g.filter(x => !x.tag || !S.setup.guestTags.includes(x.tag));
    if (untagged.length) rows.push({ t: "No tag", n: untagged.length, seg: RSVP_SEGS.map(([r]) => untagged.filter(x => (x.rsvp || "Not sent") === r).length) });
    const max = Math.max(1, ...rows.map(r => r.n));
    return `<section class="block"><div class="block-head"><h2>By tag</h2></div><div class="panel chart">

      <p class="note small">Bars show everyone invited in each tag. The number is attending out of invited.</p></div></section>`;
  })();
});

sec("seating", "🪑", "Seating Chart", G3, `<p>Start by choosing how many tables you need and how many seats each one has. Then pick a guest for each seat from its dropdown. Only guests marked Attending in the Guest List can be seated, plus the two of you, who are always in the list of people to seat.</p><p>The list on the right shows who still needs a seat, with the people they're coming with, so you can seat couples and families together. Filter it by tag to build groups. Rename a table or change its seats right on the table card.</p>`, s => {
  const g = seatPeople(), tables = S.lists.tables;
  const nm = id => (getRow("guests", id) || {}).name || "";
  const att = g.filter(x => x.rsvp === "Attending");
  const tableOf = x => tables.find(t => t.id === x.table);
  const unseatedAll = att.filter(x => !tableOf(x));
  const together = x => household(x).map(y => (y.name || "(unnamed)") + (y.child ? " (child)" : y.id === x.party || y.party === x.id ? " (plus one)" : ""));
  const label = x => x.couple ? (x.named ? `${x.name} (${x.role})` : x.name) : `${x.name || "(unnamed)"}${x.child ? " (child)" : ""}`;
  if (!tables.length) return head(s) + `<section class="block"><div class="panel" style="max-width:560px">
      <h2>Set up your tables</h2>
      <p class="note">How many tables will you have, and how many seats at each? You can rename tables, change seats and add more later.</p>
      <div class="form" style="border:0;padding:0"><label>Number of tables<input type="number" id="tblCount" min="1" max="100" value="8" inputmode="numeric"></label>
      <label>Seats per table<input type="number" id="tblSeats" min="1" max="40" value="8" inputmode="numeric"></label></div>
      <div class="uploadbar"><button type="button" class="btn primary" data-action="make-tables">Create tables</button></div>
      <p class="note">${att.length} guests are attending so far.</p></div></section>`;
  // Lay out each table's slots: guests with a seat number keep it, the rest fill the first free seats.
  const plan = tables.map(t => {
    const n = Math.max(0, Math.round(num(t.seats)));
    const here = g.filter(x => x.table === t.id);
    const slots = Array(n).fill(null), extra = [];
    here.filter(x => Number.isInteger(x.seat) && x.seat < n && !slots[x.seat]).forEach(x => slots[x.seat] = x);
    here.filter(x => !slots.includes(x)).forEach(x => { const i = slots.indexOf(null); i >= 0 ? slots[i] = x : extra.push(x); });
    return { t, slots, extra, count: here.length, n };
  });
  const totalSeats = sum(tables, t => t.seats), seated = att.filter(x => tableOf(x)).length;
  const tag = S.single.seatTag || "";
  const left = unseatedAll.filter(x => !tag || x.tag === tag);
  const opts = (cur) => `<option value="">Empty seat</option>${cur ? `<option value="${cur.id}" selected>${esc(label(cur))}</option>` : ""}${unseatedAll.map(x => { const h = household(x).filter(y => y.rsvp === "Attending").map(y => (y.name || "").split(" ")[0]); return `<option value="${x.id}">${esc(label(x))}${h.length ? " · with " + esc(h.join(", ")) : x.tag ? " · " + esc(x.tag) : ""}</option>`; }).join("")}`;
  return head(s) + `<div class="stats">
    <div class="stat"><span class="k">Seated</span><span class="v">${seated} / ${att.length}</span><div class="bar"><i style="width:${pct(seated, att.length)}%"></i></div><span class="s">attending, including you two</span></div>
    <div class="stat"><span class="k">Seats</span><span class="v">${totalSeats}</span><span class="s">${tables.length} tables · ${Math.max(0, totalSeats - seated)} open</span></div></div>
  <div class="seat-layout">
    <section class="block"><div class="block-head"><h2>Tables</h2><div class="block-actions"><button type="button" class="btn primary addbtn" data-add="tables" data-preset="${esc(JSON.stringify({ name: "Table " + (tables.length + 1), seats: tables.length ? tables[tables.length - 1].seats : 8 }))}">+ Add table</button></div></div>
      <div class="seat-grid">${plan.map(({ t, slots, extra, count, n }) => `
        <div class="seat-table ${n && count === n ? "full" : ""} ${count > n ? "over" : ""}" data-row="${t.id}">
          <div class="seat-head"><input type="text" class="tname" data-b="list|tables|${t.id}|name" data-t="text" value="${esc(t.name)}" aria-label="Table name">
            <button type="button" class="icon-btn del" data-del="tables|${t.id}" aria-label="Delete ${esc(t.name || "table")}" title="Delete table">×</button></div>
          <div class="seat-meta"><span>${count} / ${n} seated</span><label>Seats <input type="number" min="0" max="60" class="tseats" data-b="list|tables|${t.id}|seats" data-t="num" data-rerender value="${esc(t.seats)}"></label></div>
          <div class="seat-list">${slots.map((x, i) => `<label class="slot ${x ? "taken" : ""}"><span class="sn">${i + 1}</span><select data-seat="${t.id}|${i}" aria-label="${esc(t.name || "Table")}, seat ${i + 1}">${opts(x)}</select></label>`).join("")}
          ${extra.map(x => `<div class="slot over"><span class="sn">!</span><span>${esc(label(x))} has no seat: add a seat or move them</span><button type="button" class="icon-btn del" data-unseat="${x.id}" aria-label="Unseat ${esc(x.name)}">×</button></div>`).join("")}</div>
        </div>`).join("")}</div>
    </section>
    <aside class="block seat-side"><div class="block-head"><h2>Not seated yet <span class="count">${unseatedAll.length}</span></h2></div>
      <select data-b="single|seatTag" data-t="select" aria-label="Filter by tag" class="btn"><option value="">All tags</option>${S.setup.guestTags.map(t => `<option ${tag === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      ${left.length ? `<div class="unseated">${left.map(x => { const tg = together(x); return `<div class="urow"><b>${esc(label(x))}</b><small>${esc([x.tag, tg.length ? "with " + tg.join(", ") : ""].filter(Boolean).join(" · "))}</small></div>`; }).join("")}</div>`
        : `<p class="empty-state">${unseatedAll.length ? "No one with this tag is waiting for a seat." : att.length ? "Everyone attending has a seat." : "Guests appear here once their RSVP is Attending in the Guest List."}</p>`}
    </aside>
  </div>`;
});

const DEFAULT = "dashboard";

function route() { const h = (location.hash || "").slice(1); current = SECTIONS.some(s => s.id === h) ? h : DEFAULT; }

  const eb = DEMO ? "Free demo" : "Example data"; if ($("#exampleBadge").dataset.k !== eb) { $("#exampleBadge").dataset.k = eb; $("#exampleBadge").textContent = eb; }
}
function renderChrome() {
  $("#topDate").textContent = new Date().toLocaleDateString(LOC(), { weekday: "long", month: "long", day: "numeric" });
  $("#brandNames").textContent = coupleNames();
  $("#brandDate").textContent = S.setup.date ? fmtDate(S.setup.date, { month: "long", day: "numeric", year: "numeric" }) : "Wedding Planner";
}
function render(keepScroll = true) {
  const y = window.scrollY;
  CALC = new Map();
  const s = SECTIONS.find(x => x.id === current);
  let html = "";
  try { html = s.view(s); } catch (e) { console.error(e); html = head(s) + `<p class="note">This page could not be shown. Export a backup and contact support.</p>`; }
  $("#view").innerHTML = html;
  const extra = (DEMO && (current === "dashboard" || current === "setup" || (S.single.demoAdds || 0) >= BUILD.demoLimit) ? demoBar() : "")
    + (HOSTED && current === "dashboard" ? installCard() : "");
  if (extra) { const hp = $("#view > .helppanel"); hp ? hp.insertAdjacentHTML("afterend", extra) : $("#view").insertAdjacentHTML("afterbegin", extra); }

  $$("#view textarea").forEach(autosize);
  labelCells();
  renderNav(); renderChrome();

/* Give every table cell its column name, so on phones each row can show as a card with labelled fields. */
function labelCells() {
  $$("#view table.tbl").forEach(t => {
    const hr = t.tHead && t.tHead.rows[0]; if (!hr) return;
    const names = [...hr.cells].map(c => tx(c.textContent.trim()));
    [...t.tBodies].forEach(tb => [...tb.rows].forEach(tr => {
      let keyed = false;
      [...tr.cells].forEach((td, i) => {
        if (names[i] && !td.dataset.label) td.dataset.label = names[i];
        const skip = td.colSpan > 1 || ["c-check", "c-act", "c-date", "c-time", "c-money", "c-num", "c-calc"].some(c => td.classList.contains(c));
        if (!keyed && !skip) { td.classList.add("key"); keyed = true; }
        if (!keyed && i === 0 && td.classList.contains("c-check")) { td.classList.add("lead"); tr.classList.add("has-lead"); }
      });
      foldRow(tr);
    }));
    if (PHONE.matches) t.querySelectorAll("td.c-select select").forEach(sel => { const td = sel.closest("td"); if (!td.classList.contains("key") && textWidth(sel) > sel.clientWidth - 46) td.classList.add("fullw"); });
  });
}
const PHONE = window.matchMedia ? matchMedia("(max-width: 700px)") : { matches: false };
let measureCtx;
function textWidth(sel) { const o = sel.selectedOptions[0]; if (!o) return 0; measureCtx = measureCtx || document.createElement("canvas").getContext("2d"); const cs = getComputedStyle(sel); measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; return measureCtx.measureText(tx(o.text)).width; }
/* Phones: long cards (7+ fields) start folded down to their main fields. */
const foldState = new Map();
const FOLD_SHOW = { tasks: ["Due date", "Days left"] };
function foldRow(tr) {
  const id = tr.dataset.row; if (!id || tr.querySelector(".c-fold")) return;
  const cells = [...tr.cells].filter(c => !c.classList.contains("c-act"));
  if (cells.length < 7) return;
  let afterKey = -1, extra = 0;
  const del = tr.querySelector("[data-del]"), show = del && FOLD_SHOW[del.dataset.del.split("|")[0]] && FOLD_SHOW[del.dataset.del.split("|")[0]].map(tx);
  cells.forEach(c => {
    if (show) { if (!c.classList.contains("key") && !c.classList.contains("c-check") && !show.includes(c.dataset.label)) { c.classList.add("extra"); extra++; } return; }
    if (c.classList.contains("key")) { afterKey = 0; return; }
    if (c.classList.contains("c-check") && afterKey < 2) return;
    if (afterKey >= 0 && afterKey < 2) { afterKey++; return; }
    c.classList.add("extra"); extra++;
  });
  if (!extra) return;
  const folded = foldState.has(id) ? foldState.get(id) : true;
  tr.classList.add("foldable"); tr.classList.toggle("folded", folded);
  const td = document.createElement("td"); td.className = "c-fold";
  td.innerHTML = `<button type="button" class="fold-btn" data-fold="${id}" data-n="${extra}" aria-expanded="${!folded}"></button>`;
  tr.insertBefore(td, tr.querySelector(".c-act"));
  foldLabel(td.firstChild, folded);
}
function foldLabel(btn, folded) { btn.textContent = folded ? `Show ${btn.dataset.n} more details ▾` : "Hide details ▴"; btn.setAttribute("aria-expanded", String(!folded)); }
document.addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest("[data-fold]"); if (!btn) return;
  const tr = btn.closest("tr"); const folded = !tr.classList.contains("folded");
  tr.classList.toggle("folded", folded); foldState.set(btn.dataset.fold, folded); foldLabel(btn, folded); tr.querySelectorAll("textarea").forEach(autosize);
});
/* Text boxes grow to show all their text (never shorter than their set number of lines). Hidden ones are sized when shown. */
function autosize(el) { if (!el.offsetParent) return; el.style.height = "auto"; el.style.height = Math.max(el.scrollHeight + 2, el.offsetHeight) + "px"; }
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function effMode() { return S.mode === "auto" ? (darkMQ && darkMQ.matches ? "dark" : "light") : (S.mode === "dark" || S.mode === "contrast" ? "dark" : "light"); }
const CONTRAST = P("#000000 #0A0A0A #9A9A9A #262626 #FFE45C #000000 #7FD8FF #FFFFFF #FFFFFF #E0E0E0 #FF9B8F #3A0E0B");
function applyTheme() {
  const mode = effMode();
  const t = THEMES[S.theme] || THEMES.blush, c = S.mode === "contrast" ? CONTRAST : t[mode], r = document.documentElement;
  for (const k of K) r.style.setProperty("--" + k, c[k]);
  const easy = S.prefs.font === "easy";
  r.style.setProperty("--head", easy ? `"Atkinson Hyperlegible", system-ui, sans-serif` : `"${t.head}", Georgia, serif`);
  r.style.setProperty("--body", easy ? `"Atkinson Hyperlegible", system-ui, sans-serif` : `"${t.body}", system-ui, sans-serif`);
  r.dataset.size = S.prefs.size;
  r.style.setProperty("--sidew", Math.min(420, Math.max(190, num(S.prefs.sideW) || 252)) + "px");
  r.dataset.contrast = String(S.mode === "contrast");
  r.style.setProperty("--script", `"${t.script}", "Snell Roundhand", cursive`);
  r.dataset.mode = mode;
  const ds = $("#darkSwitch");
  ds.setAttribute("aria-checked", String(mode === "dark"));
  ds.title = mode === "dark" ? "Switch to light mode" : "Switch to dark mode";
  ds.querySelector(".sw-icon").textContent = mode === "dark" ? "🌙" : "☀️";
  const tp = $("#tipsSwitch"), on = S.showTips !== false;
  tp.setAttribute("aria-checked", String(on));
  tp.title = on ? "Hide the ? explanations" : "Show the ? explanations";
}

/* ================= Toast & undo ================= */
let toastTimer = null;
function toast(msg, undo, label = "Undo") {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" id="undoBtn">${esc(label)}</button>` : ""}`;
  el.hidden = false;
  if (undo) $("#undoBtn").onclick = () => { undo(); el.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 6000);
}

/* ================= Images ================= */
function readImage(file, max = 1400) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("bad image")); img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.82)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* Plus ones are linked both ways: choosing B for A also links B back to A. */
function linkPlusOne(id, before, after) {
  const me = getRow("guests", id); if (!me) return;
  if (before && before !== after) { const old = getRow("guests", before); if (old && old.party === id) old.party = ""; }
  if (!after) return;
  const other = getRow("guests", after); if (!other || other.id === id) return;
  if (!other.party) { other.party = id; save(); return; }
  if (other.party === id) return;
  const was = getRow("guests", other.party);
  setTimeout(() => toast(`${other.name || "That guest"} is already linked with ${was ? was.name : "someone else"}.`, () => {
    if (was && was.party === other.id) was.party = "";
    other.party = id; save(); render();
  }, `Link with ${me.name || "this guest"} instead`), 0);
}

        <div class="onb-two"><label>Currency<select id="onb-cur">${CURRENCIES.map(c => `<option ${c === st.currency ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>Total budget <span class="note">(optional)</span><input id="onb-budget" type="number" min="0" step="any" inputmode="decimal" value="${esc(st.totalBudget)}"></label></div>
        <p class="note small">You can change all of this later in Settings.</p>
        <div class="onb-actions"><button class="btn quiet" type="button" data-onb="back">Back</button><button class="btn primary" type="submit">Next</button></div></form>`;
    if (step === 3) body = `<h1 tabindex="-1">How it looks</h1>
      <p class="note">Pick a theme. The Dark mode switch at the bottom of the menu changes light or dark any time, and Settings has text size, high contrast and more.</p>
      <div class="seg" role="radiogroup" aria-label="Light or dark">${[["light","Light"],["dark","Dark"],["auto","Match my device"]].map(([k, l]) => `<button type="button" role="radio" aria-checked="${S.mode === k}" data-onbmode="${k}">${l}</button>`).join("")}</div>
      <div class="themepick" role="radiogroup" aria-label="Theme">${Object.entries(THEMES).map(([k, t]) => { const c = t[effMode()]; return `<button type="button" class="tcard" role="radio" aria-checked="${k === S.theme}" data-onbtheme="${k}"><b>${esc(t.name)}</b><span class="sws" aria-hidden="true">${[c.bg, c.soft, c.main, c.accent, c.strong].map(x => `<i style="background:${x}"></i>`).join("")}</span></button>`; }).join("")}</div>
      <div class="onb-actions"><button class="btn quiet" type="button" data-onb="back">Back</button><button class="btn primary" type="button" data-onb="finish" id="onb-finish">Open my planner</button></div>`;
    box.innerHTML = `<div class="onb-card"><p class="note small">Step ${step} of 3</p><div class="onb-names">${esc(step > 1 ? coupleNames() : "")}</div>${body}</div>`;
    const h = box.querySelector("h1"); if (h) h.focus();
  };
  box.onsubmit = e => {
    e.preventDefault();
    if (e.target.id === "onbForm1") { const prev = { ...S.setup }; S.setup.name1 = $("#onb-n1").value.trim(); S.setup.name2 = $("#onb-n2").value.trim(); applyCouple(prev); step = 2; }
    else if (e.target.id === "onbForm2") { S.setup.date = $("#onb-date").value; S.setup.location = $("#onb-loc").value.trim(); S.setup.currency = $("#onb-cur").value; const b = $("#onb-budget").value; S.setup.totalBudget = b === "" ? "" : Number(b); step = 3; }
    save(); paint();
  };
  box.onclick = e => {
    const b = e.target.closest("[data-onb]");
    if (b) {
      const a = b.dataset.onb;
      if (a === "back") { step--; paint(); }
      if (a === "finish") { S.onboarded = true; save(); showApp(); location.hash = "dashboard"; render(false); }
      if (a === "restore") { $("#importPick").value = ""; $("#importPick").click(); }
      if (a === "example") { S = exampleState({ theme: S.theme, mode: S.mode, prefs: S.prefs, showTips: S.showTips }); save(); applyTheme(); showApp(); location.hash = "dashboard"; render(false); }
      return;
    }
    const cp = e.target.closest("[data-onbcouple]"); if (cp) { const prev = { ...S.setup }; S.setup.name1 = $("#onb-n1").value.trim(); S.setup.name2 = $("#onb-n2").value.trim(); S.setup.couple = cp.dataset.onbcouple; applyCouple(prev); save(); paint(); return; }
    const lg = e.target.closest("[data-onblang]"); if (lg) { S.prefs.lang = lg.dataset.onblang; save(); applyLang(); paint(); return; }
    const m = e.target.closest("[data-onbmode]"); if (m) { S.mode = m.dataset.onbmode; save(); applyTheme(); paint(); return; }
    const t = e.target.closest("[data-onbtheme]"); if (t) { S.theme = t.dataset.onbtheme; save(); applyTheme(); paint(); }
  };
  paint();
}

/* ================= Boot ================= */
(async function boot() {
  S = await load();
  if (DEMO && !S.onboarded) S = exampleState({ theme: S.theme, mode: S.mode, prefs: S.prefs, showTips: S.showTips });
  route(); applyTheme(); bindEvents(); applyLang();
  if (S.onboarded) { showApp(); render(false); } else onboarding();
  setSaveState("All changes saved");
  save();
})();
})();

</script>
</body>
</html>
